<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>醫生の與與 - 官方社群連結</title>
    <!-- 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
 
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        } 

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        /* 個別平台的按鈕顏色 */
        .btn-youtube {
            background-color: #FF0000;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }

        .btn-tiktok {
            background-color: #000000;
        }

        .btn-discord {
            background-color: #5865F2;
        }

        /* 歷史紀錄按鈕風格 */
        .btn-history {
            background-color: #6c5ce7;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 大頭貼（讀取同目錄下的 banner.jpg） -->
        <img src="banner.jpg" alt="醫生成效與" class="profile-img">

        <h1>醫生の與與</h1>
        <p class="subtitle">歡迎來到我的頻道！點擊下方按鈕訂閱與追蹤最新的內容 👇</p>

        <!-- 按鈕連結區塊 -->
        <div class="links-container">
            <a href="https://www.youtube.com/@Doctor.Chen520" target="_blank" class="btn btn-youtube">
                <i class="fa-brands fa-youtube"></i> 訂閱 YouTube 頻道
            </a>

            <a href="https://www.instagram.com/doctor_chen520/" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram"></i> 追蹤 Instagram
            </a>

            <a href="https://www.tiktok.com/@lovedr520" target="_blank" class="btn btn-tiktok">
                <i class="fa-brands fa-tiktok"></i> 關注 TikTok
            </a>

            <a href="https://discord.gg/k4r9XaX925" target="_blank" class="btn btn-discord">
                <i class="fa-brands fa-discord"></i> 加入 Discord 社群
            </a>

            <!-- 新增的分頁連結按鈕 -->
            <a href="history.html" class="btn btn-history">
                <i class="fa-solid fa-clock-rotate-left"></i> 頻道歷史紀錄
            </a>
        </div>

        <footer>
            &copy; 2026 醫生の與與. All rights reserved.
        </footer>
    </div>

</body>
</html>
